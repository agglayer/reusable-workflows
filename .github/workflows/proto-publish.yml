# Protobuf Publishing Workflow
#
# This reusable workflow publishes protobuf definitions to Buf Schema Registry (BSR).
#
# CONDITIONAL EXECUTION:
# The workflow only publishes when EITHER condition is met:
# - use-git-metadata is set to true, OR
# - at least one label is provided (non-empty labels input)
#
# INPUTS:
# - use-git-metadata (boolean, default: false)
#   When true, adds --git-metadata flag to use git metadata for versioning
#
# - labels (string, default: "")
#   Comma-separated labels to apply to the published version
#   Labels are automatically trimmed of whitespace and each gets a --label flag
#
# EXAMPLES:
#
# Basic usage with git metadata:
#   uses: agglayer/reusable-workflows/.github/workflows/proto-publish.yml@main
#   with:
#     use-git-metadata: true
#   secrets:
#     BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
#
# Usage with labels:
#   uses: agglayer/reusable-workflows/.github/workflows/proto-publish.yml@main
#   with:
#     labels: "dev, staging, prod"
#   secrets:
#     BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
#
# Combined usage:
#   uses: agglayer/reusable-workflows/.github/workflows/proto-publish.yml@main
#   with:
#     use-git-metadata: true
#     labels: "production, stable"
#   secrets:
#     BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
#
# GENERATED COMMANDS:
# - use-git-metadata: true → buf push --git-metadata
# - labels: "dev,staging, prod " → buf push --label dev --label staging --label prod
# - Both → buf push --git-metadata --label dev --label staging --label prod
# - Neither → Step is skipped entirely
#
# REQUIREMENTS:
# - BUF_TOKEN secret must be configured in the calling repository
# - Repository must have protobuf definitions compatible with buf

name: Protobuf publish

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch or tag to checkout"
        required: false
        default: "main"
        type: string
      use-git-metadata:
        description: Whether to use git metadata for the versioning
        type: boolean
        default: true
      labels:
        description: Labels to apply to the published version, comma-separated
        type: string
        default: ""

jobs:
  extract-labels:
    name: Extract labels
    runs-on: ubuntu-latest
    steps:
      - name: Determine labels
        id: labels
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            echo "labels=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == "refs/heads/main" ]]; then
            echo "labels=main" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "labels=${WORKFLOW_RUN_HEAD_BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "labels=" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      labels: ${{ steps.labels.outputs.labels }}

  push-proto-to-bsr:
    needs: [extract-labels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # Fetch full history for tags and git metadata

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          setup_only: true

      - name: Publishing
        if: ${{ inputs.use-git-metadata == true || inputs.labels != '' || needs.extract-labels.outputs.labels != '' }}
        env:
          USE_GIT_METADATA: ${{ inputs.use-git-metadata }}
          INPUT_LABELS: ${{ inputs.labels }}
          EXTRACTED_LABELS: ${{ needs.extract-labels.outputs.labels }}
        run: |
          COMMAND="buf push"

          if [ "$USE_GIT_METADATA" == "true" ]; then
            COMMAND="$COMMAND --git-metadata"
          fi

          # Use input labels if provided, otherwise use extracted labels
          LABELS_TO_USE=""
          if [ -n "$INPUT_LABELS" ]; then
            LABELS_TO_USE="$INPUT_LABELS"
          elif [ -n "$EXTRACTED_LABELS" ]; then
            LABELS_TO_USE="$EXTRACTED_LABELS"
          fi

          if [ -n "$LABELS_TO_USE" ]; then
            IFS=',' read -ra LABELS <<< "$LABELS_TO_USE"
            for label in "${LABELS[@]}"; do
              label=$(echo "$label" | xargs)  # trim whitespace
              if [ -n "$label" ]; then
                COMMAND="$COMMAND --label $label"
              fi
            done
          fi

          echo "Executing: $COMMAND"
          $COMMAND
